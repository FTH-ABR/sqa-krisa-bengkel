<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQA — Bengkel Amali 2 Hari / 2-Day Hands-On Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7ECF2; --panel:#FFFFFF; --panel-2:#F4F7FA;
    --ink:#0F1620; --muted:#5A6879; --faint:#8A97A8;
    --line:#D8E0EA; --line-strong:#C3CEDC;
    --blueprint:#1B3B73; --blueprint-soft:#E9F0FA;
    --plan:#5B5FA6; --build:#1F6F8B; --verify:#26805A; --assure:#A8721E; --sustain:#9B4D7A;
    --shadow:0 1px 2px rgba(15,22,32,.04), 0 8px 28px rgba(27,59,115,.06);
    --shadow-lift:0 2px 6px rgba(15,22,32,.06), 0 18px 46px rgba(27,59,115,.12);
    --radius:14px;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --disp:'Space Grotesk', system-ui, sans-serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(231,236,242,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar-inner{display:flex;align-items:center;gap:14px;height:58px;}
  .brand{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--blueprint);display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--verify);box-shadow:0 0 0 3px rgba(38,128,90,.16);}
  .navlinks{margin-left:auto;display:flex;gap:5px;}
  .navlinks a{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:8px;transition:.18s;letter-spacing:.02em;}
  .navlinks a:hover{background:var(--panel);color:var(--ink);}
  .langswitch{display:inline-flex;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:3px;gap:2px;}
  .langswitch button{font-family:var(--mono);font-size:12px;border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s;letter-spacing:.03em;}
  .langswitch button.active{background:var(--blueprint);color:#fff;}
  .btn-print{font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;transition:.18s;}
  .btn-print:hover{border-color:var(--blueprint);color:var(--blueprint);}

  .hero{padding:60px 0 30px;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 78% 6%,#000 0%,transparent 62%);mask-image:radial-gradient(120% 90% at 78% 6%,#000 0%,transparent 62%);opacity:.55;pointer-events:none;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blueprint);display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;}
  .eyebrow .bar{width:26px;height:2px;background:var(--blueprint);display:inline-block;}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(31px,5.4vw,54px);line-height:1.04;letter-spacing:-.02em;margin:0 0 18px;max-width:18ch;}
  h1 .hl{color:var(--blueprint);}
  .lede{font-size:clamp(15.5px,2.1vw,19px);color:var(--muted);max-width:62ch;margin:0 0 22px;}
  .lede strong{color:var(--ink);font-weight:600;}
  .modern-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
  .mtag{font-family:var(--mono);font-size:11.5px;color:var(--blueprint);background:var(--blueprint-soft);border:1px solid #d5e2f3;padding:5px 11px;border-radius:20px;}
  .meta-strip{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .meta{background:var(--panel);padding:16px 22px;flex:1 1 150px;min-width:140px;}
  .meta .k{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
  .meta .v{font-family:var(--disp);font-weight:600;font-size:25px;margin-top:3px;line-height:1;}
  .meta .v small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);}

  section{padding:40px 0;}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .sec-num{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em;}
  .sec-title{font-family:var(--disp);font-weight:600;font-size:clamp(21px,3.3vw,29px);letter-spacing:-.01em;margin:0;}
  .sec-sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:72ch;}

  .objgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow);}
  .obj{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14.5px;color:#26313f;border-bottom:1px solid var(--panel-2);}
  .obj .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blueprint);flex:none;width:24px;height:24px;border-radius:6px;background:var(--blueprint-soft);display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .obj b{color:var(--ink);font-weight:600;}

  .pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .phase{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 15px 15px;border-top:3px solid var(--pc);position:relative;box-shadow:var(--shadow);}
  .phase .pn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--pc);font-weight:600;}
  .phase h4{font-family:var(--disp);font-weight:600;font-size:16px;margin:8px 0 6px;}
  .phase p{font-size:13px;color:var(--muted);margin:0;line-height:1.45;}
  .phase .arrow{position:absolute;right:-11px;top:50%;transform:translateY(-50%);z-index:2;color:var(--line-strong);font-size:16px;}
  .phase:last-child .arrow{display:none;}

  .day-band{display:flex;align-items:center;gap:20px;margin:6px 0 26px;padding:22px 26px;border-radius:var(--radius);background:var(--blueprint);color:#fff;box-shadow:var(--shadow-lift);position:relative;overflow:hidden;}
  .day-band::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;}
  .day-tag{font-family:var(--mono);font-size:12px;letter-spacing:.2em;opacity:.72;position:relative;}
  .day-band h3{font-family:var(--disp);font-weight:700;font-size:clamp(19px,3vw,26px);margin:4px 0 0;position:relative;}
  .day-band .theme{margin-left:auto;text-align:right;position:relative;}
  .day-band .theme .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.13em;opacity:.6;text-transform:uppercase;}
  .day-band .theme .val{font-family:var(--disp);font-weight:600;font-size:16px;margin-top:2px;}

  .mod{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;border-left:4px solid var(--pc,var(--blueprint));transition:box-shadow .2s;}
  .mod:hover{box-shadow:var(--shadow-lift);}
  .mod-top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 22px;cursor:pointer;}
  .mod-id{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--pc);background:color-mix(in srgb,var(--pc) 10%, #fff);border:1px solid color-mix(in srgb,var(--pc) 26%, #fff);padding:7px 10px;border-radius:8px;white-space:nowrap;letter-spacing:.03em;}
  .mod-heading{min-width:0;}
  .mod-heading h4{font-family:var(--disp);font-weight:600;font-size:17.5px;margin:0;letter-spacing:-.01em;}
  .mod-heading .my{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:3px;letter-spacing:.01em;}
  .mod-right{display:flex;align-items:center;gap:14px;}
  .phase-pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--pc);background:color-mix(in srgb,var(--pc) 11%, #fff);padding:5px 9px;border-radius:20px;white-space:nowrap;}
  .dur{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;}
  .chev{width:22px;height:22px;flex:none;color:var(--faint);transition:transform .25s;}
  details[open] .chev{transform:rotate(180deg);}
  .mod-body{padding:2px 22px 22px;border-top:1px dashed var(--line);}
  .mod-body-inner{padding-top:18px;display:grid;grid-template-columns:1fr;gap:16px;}
  .block .blabel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .block .blabel::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc);}
  .block p{margin:0;font-size:14.5px;color:#26313f;}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;}
  .steps li{position:relative;padding:9px 0 9px 40px;font-size:14.5px;color:#26313f;border-bottom:1px solid var(--panel-2);}
  .steps li:last-child{border-bottom:none;}
  .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--pc);display:flex;align-items:center;justify-content:center;}
  .sublab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--pc);font-weight:600;margin:4px 0 2px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:var(--mono);font-size:12px;color:#33414f;background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;border-radius:7px;}
  .output{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--pc) 7%, #fff);border:1px solid color-mix(in srgb,var(--pc) 22%,#fff);border-radius:10px;padding:13px 15px;}
  .output .tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#fff;background:var(--pc);padding:4px 8px;border-radius:6px;white-space:nowrap;margin-top:1px;}
  .output .txt{font-size:14px;color:#26313f;font-weight:500;}

  .brk{display:flex;align-items:center;gap:12px;margin:2px 0 16px;padding-left:6px;font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.03em;}
  .brk .ln{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 12px);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);}
  .card h4{font-family:var(--disp);font-weight:600;font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:10px;}
  .card h4 .ic{width:30px;height:30px;border-radius:8px;background:var(--blueprint-soft);color:var(--blueprint);display:flex;align-items:center;justify-content:center;flex:none;}
  .list{margin:0;padding:0;list-style:none;}
  .list li{position:relative;padding:7px 0 7px 24px;font-size:14px;color:#2b3644;border-bottom:1px solid var(--panel-2);}
  .list li:last-child{border-bottom:none;}
  .list li::before{content:"";position:absolute;left:2px;top:14px;width:9px;height:9px;border-radius:2px;background:var(--blueprint);opacity:.85;}
  .list.ok li::before{background:var(--verify);}
  .kbd{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--blueprint);}
  .note-inline{font-size:13px;color:var(--muted);margin:14px 0 0;}
  .krisa-intro{font-size:14.5px;color:#26313f;margin:0 0 18px;max-width:84ch;}
  .krisa-note{font-size:12.5px;color:var(--muted);margin:16px 0 0;max-width:84ch;}
  .tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .trainer{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between;}
  .trainer-id{display:flex;align-items:center;gap:16px;}
  .tr-ava{width:54px;height:54px;border-radius:50%;background:var(--blueprint);color:#fff;font-family:var(--disp);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 4px var(--blueprint-soft);}
  .tr-name{font-family:var(--disp);font-weight:600;font-size:19px;}
  .tr-role{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.02em;}
  .trainer-contacts{display:flex;flex-wrap:wrap;gap:10px;}
  .tc{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:9px 13px;border-radius:9px;transition:.16s;}
  .tc:hover{border-color:var(--blueprint);color:var(--blueprint);background:var(--panel);}
  .tc svg{width:15px;height:15px;color:var(--blueprint);flex:none;}

  .tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .tbl th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 20px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .tbl td{padding:13px 20px;border-bottom:1px solid var(--panel-2);vertical-align:top;font-size:14px;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl .cat{font-family:var(--disp);font-weight:600;color:var(--ink);white-space:nowrap;width:34%;}
  .tbl .tools{color:#33414f;font-family:var(--mono);font-size:12.5px;}

  .assess{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .assess .card{padding:20px;}
  .assess .pct{font-family:var(--disp);font-weight:700;font-size:32px;color:var(--blueprint);line-height:1;}
  .assess .nm{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:8px 0 6px;}
  .assess .ds{font-size:13.5px;color:var(--muted);}
  .outcome{background:var(--blueprint);color:#fff;border-radius:var(--radius);padding:28px 30px;box-shadow:var(--shadow-lift);position:relative;overflow:hidden;}
  .outcome::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;}
  .outcome h4{font-family:var(--disp);font-weight:600;font-size:19px;margin:0 0 12px;position:relative;}
  .outcome p{font-size:14.5px;line-height:1.65;margin:0;color:#dfe8f5;position:relative;max-width:82ch;}

  footer{border-top:1px solid var(--line);padding:32px 0 60px;margin-top:16px;}
  .foot-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;}
  .foot-inner .note{font-size:13px;color:var(--muted);max-width:64ch;}
  .foot-inner .sig{font-family:var(--mono);font-size:12px;color:var(--faint);}

  .rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease;}
  .rv.in{opacity:1;transform:none;}

  @media (max-width:900px){ .navlinks{display:none;} }
  @media (max-width:820px){
    .pipeline{grid-template-columns:1fr 1fr;} .phase .arrow{display:none;}
    .grid2,.assess,.objgrid{grid-template-columns:1fr;}
    .mod-top{grid-template-columns:auto 1fr;grid-template-areas:"id head" "right right";row-gap:12px;}
    .mod-id{grid-area:id;} .mod-heading{grid-area:head;} .mod-right{grid-area:right;justify-content:flex-start;}
    .day-band{flex-direction:column;align-items:flex-start;gap:10px;} .day-band .theme{margin-left:0;text-align:left;}
    .meta{flex-basis:calc(50% - 1px);}
    .tbl .cat{white-space:normal;}
    .brand span.full{display:none;}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;} .rv{transition:none;opacity:1;transform:none;} .chev{transition:none;}}
  @media print{.topbar{display:none;} .hero::before,.day-band::after,.outcome::after{display:none;} body{background:#fff;} .mod-body{display:block!important;} .chev{display:none;} .mod,.card,.phase{box-shadow:none;break-inside:avoid;} section{padding:16px 0;} .rv{opacity:1;transform:none;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-inner">
    <span class="brand"><span class="dot"></span><span id="brandtxt">SQA · BENGKEL AMALI</span></span>
    <nav class="navlinks" id="navlinks"></nav>
    <div class="langswitch" role="group" aria-label="Language">
      <button data-lang="ms" class="active" onclick="setLang('ms')">BM</button>
      <button data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <button class="btn-print" id="printbtn" onclick="window.print()">Cetak / PDF</button>
  </div>
</div>

<main id="app"></main>

<script>
/* ---------------- CONTENT (one clean source per language) ---------------- */
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
const PCV = {foundation:'var(--blueprint)',plan:'var(--plan)',build:'var(--build)',verify:'var(--verify)',assure:'var(--assure)',sustain:'var(--sustain)',all:'var(--blueprint)'};

const UI = {
  ms:{

    labels:{obj:"Objektif",topics:"Topik ringkas",lab:"Makmal amali",activity:"Aktiviti amali",team:"Langkah pasukan (10)",tools:"Alatan",out:"OUTPUT →",module:"MODUL",capstone:"CAPSTONE",

    labels:{obj:"Objective",topics:"Key topics",lab:"Hands-on lab",activity:"Hands-on activity",team:"Team steps (10)",tools:"Tools",out:"OUTPUT →",module:"MODULE",capstone:"CAPSTONE",
      phase:{foundation:"Foundation",plan:"Plan",build:"Build-in",verify:"Verify",assure:"Assure",sustain:"Sustain",all:"All phases"}}
  }
};

const HERO = {
  ms:{
    eyebrow:"2 Hari · Dipimpin Instruktur · Amali (Hands-On)",
    h1:'Menguasai <span class="hl">Jaminan Kualiti Perisian (SQA)</span> moden — dipraktikkan hujung ke hujung.',
    lede:'Dua hari. <strong>Satu projek sebenar.</strong> Setiap aktiviti SQA — dari <strong>perancangan kualiti</strong> hingga <strong>pemantauan</strong> produksi — dipraktikkan sebagai satu aliran kerja berterusan pada satu projek (<strong>ShopFast checkout</strong>). Setiap sesi makmal menyuap sesi seterusnya, jadi anda pulang dengan jejak kualiti lengkap yang anda bina sendiri. Langkah dibuat ringkas supaya senang diikuti. Diselaraskan dengan KRISA 2.0 (JDN) untuk sektor awam.',

    meta:[["Tempoh","2","hari · 16 jam"],["Format","~80%","amali"],["Modul","8","+ capstone"],["Hasil kerja","12+","dokumen"]]
  },
  en:{

    h1:'Mastering modern <span class="hl">Software Quality Assurance</span> — practiced end-to-end.',

    tags:["KRISA 2.0-aligned (JDN)","Shift-Left Testing","Shift-Right Testing","Agile QA","DevOps","CI/CD Quality Gates","Test Automation","Continuous Quality"],
    meta:[["Duration","2","days · 16 hrs"],["Format","~80%","hands-on"],["Modules","8","+ capstone"],["Deliverables","12+","artifacts"]]
  }
};

const OBJ = {

function chips(arr){return '<div class="chips">'+arr.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div>';}
function steps(arr){return '<ol class="steps">'+arr.map(s=>'<li>'+s+'</li>').join('')+'</ol>';}
function durText(d,lang){const p=d.split(' / ');return lang==='ms'?p[0]:p[1];}

function moduleHTML(m,lang,L){
  const key = m.capstone?'cap':('m'+m.n);
  const pc = PCV[m.phase];
  const idLabel = m.capstone?L.capstone:(L.module+' '+m.n);
  const phaseLabel = L.phase[m.phase];
  const labLabel = m.labKind==='activity'?L.activity : m.labKind==='team'?L.team : L.lab;
  let labBlock='';
  if(m.labs){
    labBlock = m.labs[lang].map((g,i)=>'<div class="sublab"'+(i>0?' style="margin-top:12px;"':'')+'>'+g.sub+'</div>'+steps(g.steps)).join('');
  } else {
    labBlock = steps(m.steps[lang]);
  }
  let inner = '<div class="block"><div class="blabel">'+L.obj+'</div><p>'+m.obj[lang]+'</p></div>';
  if(m.topics) inner += '<div class="block"><div class="blabel">'+L.topics+'</div>'+chips(m.topics[lang])+'</div>';
  inner += '<div class="block"><div class="blabel">'+labLabel+'</div>'+labBlock+'</div>';
  if(m.tools) inner += '<div class="block"><div class="blabel">'+L.tools+'</div>'+chips(m.tools[lang])+'</div>';
  inner += '<div class="output"><span class="tag">'+L.out+'</span><span class="txt">'+m.out[lang]+'</span></div>';
  return '<details class="mod rv" data-key="'+key+'"'+(m.open?' open':'')+' style="--pc:'+pc+'">'
    +'<summary class="mod-top"><span class="mod-id">'+idLabel+'</span>'
    +'<div class="mod-heading"><h4>'+m.title[lang]+'</h4><div class="my">'+m.sub[lang]+'</div></div>'
    +'<div class="mod-right"><span class="phase-pill">'+phaseLabel+'</span><span class="dur">'+durText(m.dur,lang)+'</span>'+CHEV+'</div>'
    +'</summary><div class="mod-body"><div class="mod-body-inner">'+inner+'</div></div></details>';
}
function breakHTML(b,lang){return '<div class="brk rv"><span>'+b.time+'</span><span class="ln"></span><span>'+b.text[lang]+'</span></div>';}

function dayHTML(day,lang,L,secId){

    +'<div class="theme"><div class="lbl">'+b.lbl[lang]+'</div><div class="val">'+b.val[lang]+'</div></div></div>';
  h+=day.items.map(it=>it.kind==='break'?breakHTML(it,lang):moduleHTML(it,lang,L)).join('');
  h+='</div></section>';
  return h;
}

/* ---------------- STATE, TOGGLE, REVEAL ---------------- */
let LANG='ms';
let first=true;

function attachReveal(){
  const els=[...document.querySelectorAll('.rv')];
  if(first){
    const io=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1,rootMargin:'0px 0px -40px 0px'});
    els.forEach((el,i)=>{el.style.transitionDelay=Math.min(i%6*40,200)+'ms';io.observe(el);});
    first=false;
  } else {
    els.forEach(el=>el.classList.add('in')); // no re-animation on language toggle
  }
  // nav active highlight
  const links=[...document.querySelectorAll('.navlinks a')];
  const map=links.map(l=>({l,sec:document.querySelector(l.getAttribute('href'))})).filter(x=>x.sec);
  const navio=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){const hit=map.find(m=>m.sec===e.target);if(hit){links.forEach(l=>{l.style.color='';l.style.background='';});hit.l.style.color='var(--blueprint)';hit.l.style.background='var(--panel)';}}});},{rootMargin:'-45% 0px -50% 0px'});
  map.forEach(m=>navio.observe(m.sec));
}

function setLang(lang){
  if(lang===LANG && !first) return;
  // preserve which modules are open
  const openState={};
  document.querySelectorAll('details.mod').forEach(d=>{openState[d.dataset.key]=d.open;});
  const y=window.scrollY;
  LANG=lang;
  render(lang);
  document.querySelectorAll('details.mod').forEach(d=>{if(d.dataset.key in openState) d.open=openState[d.dataset.key];});
  document.querySelectorAll('.langswitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  attachReveal();
  window.scrollTo(0,y);
}

// initial render
render(LANG);
attachReveal();
