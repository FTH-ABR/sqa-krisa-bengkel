openapi: 3.0.3
info:
  title: ShopFast Checkout API
  version: 1.1.0
  description: |
    Synthetic training system for the SQA Bengkel (KRISAv2 / PPrISA 2.0).
    All data is fictitious. Base URL when running locally: http://localhost:3000
    Cart state is kept per session using the X-Session-Id header (any string).
    A logged-in member may also send Authorization: Bearer <token> so the member discount applies.
    Requirement IDs REQ-CHK-01 to REQ-CHK-06 are defined in SRS-ShopFast.md.
servers:
  - url: http://localhost:3000
tags:
  - name: health
  - name: catalogue
  - name: cart
  - name: checkout
  - name: auth
  - name: orders
paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  version: {type: string, example: 1.0.0}
  /api/products:
    get:
      tags: [catalogue]
      summary: List products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Product'}
  /api/cart:
    get:
      tags: [cart]
      summary: Get the current cart with computed totals (member discount applied when a member token is sent)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
  /api/cart/items:
    post:
      tags: [cart]
      summary: Add a product to the cart
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: {type: string, example: P001}
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 2
      responses:
        '201':
          description: Item added, returns the updated cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '400':
          description: Invalid quantity or unknown product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/cart/items/{productId}:
    delete:
      tags: [cart]
      summary: Remove a product from the cart
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: productId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
  /api/discounts/apply:
    post:
      tags: [cart]
      summary: Apply a discount code to the cart
      description: |
        REQ-CHK-02: code must be 6 to 10 uppercase letters or digits.
        RAYA15 gives 15% off, MEGA20 gives 20% off. EXPIRED15 expired on 31 Dec 2025.
        REQ-CHK-03: member 10% plus promo, total discount capped at 25% of subtotal.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[A-Z0-9]{6,10}$', example: RAYA15}
      responses:
        '200':
          description: Code applied, returns the updated cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '422':
          description: INVALID_CODE_FORMAT, INVALID_CODE or CODE_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/checkout:
    post:
      tags: [checkout]
      summary: Place an order from the current cart
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400':
          description: VALIDATION_ERROR, CARD_EXPIRED or CART_EMPTY
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and receive a bearer token
      description: The account is locked for 15 minutes after 3 consecutive failed attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, example: aminah@example.test}
                password: {type: string, example: Latihan123!}
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  expiresIn: {type: integer, example: 3600}
                  isMember: {type: boolean, example: true}
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '423':
          description: Account locked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/orders/{orderId}:
    get:
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, example: SF-1001}
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /api/orders/{orderId}/transitions:
    post:
      tags: [orders]
      summary: Move an order through its lifecycle (REQ-CHK-05)
      description: |
        NEW pay PAID, PAID pack PACKED, PACKED ship SHIPPED, SHIPPED receive COMPLETED,
        NEW fail PAYMENT_FAILED, NEW cancel CANCELLED, PAID cancel CANCELLED.
        Any other transition is rejected with 409 INVALID_TRANSITION.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: orderId
          in: path
          required: true
          schema: {type: string, example: SF-1001}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [pay, pack, ship, receive, fail, cancel]
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404':
          description: Order not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: INVALID_TRANSITION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  parameters:
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      schema: {type: string, example: trainee-01}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Product:
      type: object
      properties:
        id: {type: string, example: P001}
        name: {type: string, example: Baju Kurung Moden}
        price: {type: number, format: double, example: 89.90}
        stock: {type: integer, example: 25}
    CartItem:
      type: object
      properties:
        productId: {type: string}
        name: {type: string}
        unitPrice: {type: number}
        quantity: {type: integer}
        lineTotal: {type: number}
    Cart:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CartItem'}
        subtotal: {type: number, example: 200.00}
        discountCode: {type: string, nullable: true, example: RAYA15}
        memberDiscount: {type: number, example: 20.00}
        promoDiscount: {type: number, example: 30.00}
        discount: {type: number, example: 50.00}
        shipping: {type: number, example: 0}
        total: {type: number, example: 150.00}
    CheckoutRequest:
      type: object
      required: [fullName, email, phone, postcode, paymentMethod]
      properties:
        fullName: {type: string, minLength: 3, maxLength: 80, example: Aminah binti Ali}
        email: {type: string, format: email, example: aminah@example.test}
        phone: {type: string, pattern: '^01[0-9]{8,9}$', example: '0123456789'}
        postcode: {type: string, pattern: '^[0-9]{5}$', example: '50480'}
        paymentMethod:
          type: string
          enum: [FPX, CARD, EWALLET]
        cardExpiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
          description: Required when paymentMethod is CARD (REQ-CHK-04)
          example: '12/27'
    Order:
      type: object
      properties:
        orderId: {type: string, example: SF-1001}
        status: {type: string, enum: [NEW, PAID, PACKED, SHIPPED, COMPLETED, PAYMENT_FAILED, CANCELLED]}
        fullName: {type: string}
        email: {type: string}
        phone: {type: string}
        postcode: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/CartItem'}
        subtotal: {type: number}
        discount: {type: number}
        shipping: {type: number}
        total: {type: number}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error: {type: string, example: VALIDATION_ERROR}
        message: {type: string, example: quantity must be between 1 and 10}
