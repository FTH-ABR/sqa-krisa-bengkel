name: ShopFast quality gate

on:
  push:
    paths:
      - 'lab/shopfast/**'
      - '.github/workflows/shopfast-quality-gate.yml'
  pull_request:
    paths:
      - 'lab/shopfast/**'
      - '.github/workflows/shopfast-quality-gate.yml'
  workflow_dispatch:

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab/shopfast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab/shopfast/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run API and UI tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: lab/shopfast/playwright-report/
          retention-days: 14
